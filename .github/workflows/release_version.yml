name: Release Version

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Build projects
      run: |
        dotnet build Payment.Domain/Payment.Domain.csproj
        dotnet build ATM.Domain/ATM.Domain.csproj

    - name: Create NuGet packages
      run: |
        dotnet pack Payment.Domain/Payment.Domain.csproj -o ./nugets
        dotnet pack ATM.Domain/ATM.Domain.csproj -o ./nugets

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./nugets
        asset_name: nugets
        asset_content_type: application/zip