name: Publish Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install DocFx
      run: dotnet tool install -g docfx

    - name: Create DocFx configuration
      run: |
        mkdir -p docs
        cat > docfx.json << 'EOF'
        {
          "metadata": [
            {
              "src": [
                {
                  "files": ["**/*.csproj"],
                  "src": "."
                }
              ],
              "dest": "api"
            }
          ],
          "build": {
            "content": [
              {
                "files": ["api/**.yml", "api/index.md"]
              },
              {
                "files": ["README.md", "**/*.md"],
                "exclude": ["obj/**", "bin/**"]
              }
            ],
            "resource": [
              {
                "files": ["images/**"]
              }
            ],
            "dest": "_site",
            "template": ["default"]
          }
        }
        EOF

    - name: Build documentation
      run: |
        docfx metadata
        docfx build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GHTOKEN }}
        publish_dir: ./_site